name: Build and push Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default variant: CUDA 13.2 / cu128, Ampere/Ada/Blackwell.
          # Requires host driver >= 580.
          - target: pod
            rolling: latest
            tag_suffix: ''
            cuda_version: 13.2.0
            ubuntu_version: '24.04'
            torch_index: cu128
            torch_arch_list: '8.6 8.9 12.0'
          - target: serverless
            rolling: serverless
            tag_suffix: ''
            cuda_version: 13.2.0
            ubuntu_version: '24.04'
            torch_index: cu128
            torch_arch_list: '8.6 8.9 12.0'
          # cu124 variant: runs on hosts with CUDA 12.4 drivers (e.g. 550.x).
          # Targets Ampere/Ada (sm_86/sm_89, 3090/4090). Tagged with a -cu124 suffix.
          - target: pod
            rolling: latest
            tag_suffix: '-cu124'
            cuda_version: 12.4.1
            ubuntu_version: '22.04'
            torch_index: cu124
            torch_arch_list: '8.6 8.9'
          - target: serverless
            rolling: serverless
            tag_suffix: '-cu124'
            cuda_version: 12.4.1
            ubuntu_version: '22.04'
            torch_index: cu124
            torch_arch_list: '8.6 8.9'
          # cu128 variant: runs on hosts with CUDA 12.8 drivers (e.g. 570.x).
          # Targets Ampere/Blackwell (sm_86/sm_120, 3090/5090). Tagged with a -cu128 suffix.
          - target: pod
            rolling: latest
            tag_suffix: '-cu128'
            cuda_version: 12.8.1
            ubuntu_version: '22.04'
            torch_index: cu128
            torch_arch_list: '8.6 12.0'
          # Experimental shared-stack image for 3090/4090 hosts on driver 550.x.
          # CUDA 12.4 base, pinned PyTorch cu126; GPU validation is separate.
          - target: toolkit
            dockerfile: Dockerfile.toolkit
            rolling: toolkit
            tag_suffix: '-cu124'
            cuda_version: 12.4.1
            ubuntu_version: '22.04'
            torch_index: cu126
            torch_arch_list: '8.6 8.9'

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # Produces:
      #   Immutable per-commit:   <target>-<short-sha>[-cu124]    (every push)
      #   Immutable semver:       <target>-vX.Y.Z[-cu124]         (on tag vX.Y.Z)
      #                           <target>-vX.Y[-cu124]           (on tag vX.Y.Z)
      #   Rolling (main only):    latest | serverless | latest-cu124 | serverless-cu124
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=${{ matrix.target }}-,suffix=${{ matrix.tag_suffix }},format=short
            type=semver,prefix=${{ matrix.target }}-,suffix=${{ matrix.tag_suffix }},pattern={{version}}
            type=semver,prefix=${{ matrix.target }}-,suffix=${{ matrix.tag_suffix }},pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.rolling }}${{ matrix.tag_suffix }},enable={{is_default_branch}}

      - name: Build and push ${{ matrix.target }}${{ matrix.tag_suffix }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          target: ${{ matrix.target }}
          push: ${{ matrix.target != 'toolkit' }}
          load: ${{ matrix.target == 'toolkit' }}
          platforms: linux/amd64
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            TORCH_INDEX=${{ matrix.torch_index }}
            TORCH_ARCH_LIST=${{ matrix.torch_arch_list }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache-${{ matrix.target }}${{ matrix.tag_suffix }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache-pod${{ matrix.tag_suffix }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache-serverless${{ matrix.tag_suffix }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ matrix.rolling }}${{ matrix.tag_suffix }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache-${{ matrix.target }}${{ matrix.tag_suffix }},mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true
          provenance: false

      - name: Check Toolkit image before publishing
        if: matrix.target == 'toolkit'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE_TAGS%%$'\n'*}"
          docker run --rm --entrypoint /root/ComfyUI/venv/bin/python "$image" /opt/toolkit/smoke_test.py
          docker run --rm --entrypoint /bin/bash "$image" -c '
            set -e
            cd /root/ai-toolkit/ui
            npm run start > /tmp/ui.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8675/api/jobs > /tmp/jobs.json; then
                python3 -c "import json; assert json.load(open(\"/tmp/jobs.json\")) == {\"jobs\": []}"
                exit 0
              fi
              sleep 2
            done
            tail -n 30 /tmp/ui.log
            exit 1
          '
          docker image inspect --format='Uncompressed image size: {{.Size}} bytes' "$image"

      - name: Publish checked Toolkit image
        if: matrix.target == 'toolkit'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            docker push "$image"
          done <<< "$IMAGE_TAGS"
